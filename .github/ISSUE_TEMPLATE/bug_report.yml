name: Bug report
description: Something isn't working in Lumove Cut
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Help → About shows it (e.g. 0.2.0).
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. \n2. \n3. "
  - type: input
    id: hardware
    attributes:
      label: GPU / Windows version
      description: Helps with capture and export issues (e.g. RTX 3060, Windows 11).
  - type: markdown
    attributes:
      value: "**Please attach `lumove.log`** from *Help → Open Logs Folder* (drag it into the box above). Reports with logs are much faster to fix."
